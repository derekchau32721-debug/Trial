<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Performance Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #111827;
      --bg-3: #1e293b;
      --line: rgba(255,255,255,0.10);
      --line-strong: rgba(255,255,255,0.16);
      --text-soft: rgba(255,255,255,0.68);
      --text-faint: rgba(255,255,255,0.48);
      --green: #34d399;
      --red: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: white;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(59, 130, 246, 0.16), transparent 28%),
        radial-gradient(circle at top right, rgba(168, 85, 247, 0.12), transparent 30%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
    }

    .glass {
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid var(--line-strong);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 10px 35px rgba(2, 6, 23, 0.35),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .glass-soft {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .tab-btn {
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.76);
      padding: 0.85rem 1.35rem;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      color: white;
      background: rgba(255,255,255,0.10);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      color: white;
      border-color: rgba(255,255,255,0.16);
      background: linear-gradient(135deg, rgba(59,130,246,0.28), rgba(168,85,247,0.18));
      box-shadow: 0 8px 24px rgba(59,130,246,0.18);
    }

    .panel {
      animation: fadeIn 0.28s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sheet-wrap {
      overflow-x: auto;
      border-radius: 1rem;
    }

    .sheet-wrap table {
      width: 100% !important;
      border-collapse: collapse !important;
      color: white;
      font-size: 0.95rem;
      min-width: 720px;
    }

    .sheet-wrap thead th,
    .sheet-wrap tr:first-child th,
    .sheet-wrap tr:first-child td {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(15, 23, 42, 0.82);
      color: rgba(255,255,255,0.92);
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      font-weight: 700;
      white-space: nowrap;
    }

    .sheet-wrap tbody td,
    .sheet-wrap tr td {
      padding: 13px 16px;
      color: rgba(255,255,255,0.82);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      white-space: nowrap;
    }

    .sheet-wrap tbody tr:hover td,
    .sheet-wrap tr:hover td {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.96);
    }

    .sortable-head {
      cursor: pointer;
      user-select: none;
    }

    .sortable-head:hover {
      background: rgba(30, 41, 59, 0.96) !important;
    }

    .sort-inner {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .sort-icon {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.45);
    }

    .positive {
      color: var(--green) !important;
      font-weight: 700;
    }

    .negative {
      color: var(--red) !important;
      font-weight: 700;
    }

    .neutral {
      color: rgba(255,255,255,0.88) !important;
      font-weight: 600;
    }

    .small-muted {
      color: var(--text-soft);
      font-size: 0.95rem;
    }

    .eyebrow {
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.24em;
      font-size: 0.78rem;
      font-weight: 700;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255,255,255,0.28);
    }
  </style>
</head>
<body>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-10">
    <header class="glass rounded-[28px] px-6 py-6 md:px-8 md:py-7 mb-8">
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-5">
        <div>
          <div class="eyebrow mb-2">Analytics Workspace</div>
          <h1 class="text-3xl md:text-4xl font-bold tracking-tight">
            Market Performance Dashboard
          </h1>
          <p class="small-muted mt-2">
            Sector and country performance view with sortable columns and conditional move colors.
          </p>
        </div>

        <div class="glass-soft rounded-2xl px-4 py-3 text-sm text-white/70">
          Source file:
          <span class="text-white font-semibold">Market_Performance.xlsx</span>
        </div>
      </div>
    </header>

    <div class="glass rounded-2xl p-3 inline-flex flex-wrap gap-3 mb-8">
      <button id="tab-sector" class="tab-btn active" onclick="showTab('sector')">Sector</button>
      <button id="tab-country" class="tab-btn" onclick="showTab('country')">Country</button>
    </div>

    <section id="sector" class="panel block"></section>
    <section id="country" class="panel hidden"></section>
  </main>

  <script>
    let workbook;

    async function init() {
      const response = await fetch("Market_Performance.xlsx");
      const arrayBuffer = await response.arrayBuffer();
      workbook = XLSX.read(arrayBuffer, { type: "array" });

      renderSheet(
        "Sector Performance",
        "sector",
        "Sector Performance",
        "Performance breakdown across sectors."
      );

      renderSheet(
        "Country Performance",
        "country",
        "Country Performance",
        "Performance breakdown across countries."
      );
    }

    function renderSheet(sheetName, targetId, title, subtitle) {
      const sheet = workbook.Sheets[sheetName];

      if (!sheet) {
        document.getElementById(targetId).innerHTML = `
          <div class="glass rounded-[28px] p-6 md:p-7">
            <h2 class="text-xl font-semibold">${title}</h2>
            <p class="small-muted mt-2">Sheet not found: ${sheetName}</p>
          </div>
        `;
        return;
      }

      const html = XLSX.utils.sheet_to_html(sheet);

      document.getElementById(targetId).innerHTML = `
        <div class="glass rounded-[28px] p-5 md:p-7 border border-white/10">
          <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-2 mb-5">
            <div>
              <h2 class="text-xl md:text-2xl font-semibold tracking-tight">${title}</h2>
              <p class="small-muted mt-1">${subtitle}</p>
            </div>
          </div>

          <div class="sheet-wrap glass-soft rounded-2xl p-2 md:p-3">
            ${html}
          </div>
        </div>
      `;

      const table = document.querySelector(`#${targetId} table`);
      if (!table) return;

      normalizeTable(table);
      enhanceTable(table);
    }

    function normalizeTable(table) {
      const rows = [...table.querySelectorAll("tr")];
      if (!rows.length) return;

      const firstRow = rows[0];
      const firstCells = [...firstRow.children];

      if (!table.querySelector("thead")) {
        const thead = document.createElement("thead");
        const tbody = document.createElement("tbody");

        const headerRow = document.createElement("tr");
        firstCells.forEach(cell => {
          const th = document.createElement("th");
          th.innerHTML = cell.innerHTML;
          headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);

        rows.slice(1).forEach(row => {
          const newRow = document.createElement("tr");
          [...row.children].forEach(cell => {
            const td = document.createElement("td");
            td.innerHTML = cell.innerHTML;
            newRow.appendChild(td);
          });
          tbody.appendChild(newRow);
        });

        table.innerHTML = "";
        table.appendChild(thead);
        table.appendChild(tbody);
      }
    }

    function enhanceTable(table) {
      const headerCells = [...table.querySelectorAll("thead th")];
      const bodyRows = [...table.querySelectorAll("tbody tr")];
      const headers = headerCells.map(th => th.textContent.trim().toLowerCase());

      const lastPriceIndex = headers.findIndex(h =>
        h.includes("last price") || h === "last" || h.includes("px last")
      );

      const percentIndexes = headers
        .map((h, i) => ({ h, i }))
        .filter(x =>
          x.h.includes("%") ||
          x.h.includes("change") ||
          x.h.includes("move")
        )
        .map(x => x.i);

      bodyRows.forEach(row => {
        const cells = [...row.querySelectorAll("td")];
        if (!cells.length) return;

        if (lastPriceIndex >= 0 && cells[lastPriceIndex]) {
          const num = parseSortableValue(cells[lastPriceIndex].textContent);
          if (!Number.isNaN(num)) {
            cells[lastPriceIndex].textContent = num.toFixed(1);
            cells[lastPriceIndex].classList.add("neutral");
          }
        }

        percentIndexes.forEach(index => {
          const cell = cells[index];
          if (!cell) return;

          const value = parseSortableValue(cell.textContent);
          if (Number.isNaN(value)) return;

          cell.classList.remove("positive", "negative", "neutral");

          if (value > 0) {
            cell.classList.add("positive");
          } else if (value < 0) {
            cell.classList.add("negative");
          } else {
            cell.classList.add("neutral");
          }
        });
      });

      headerCells.forEach((header, index) => {
        const originalText = header.textContent.trim();
        header.classList.add("sortable-head");
        header.dataset.sortDir = "desc";
        header.innerHTML = `
          <div class="sort-inner">
            <span>${escapeHtml(originalText)}</span>
            <span class="sort-icon">↕</span>
          </div>
        `;

        header.addEventListener("click", () => {
          const currentDir = header.dataset.sortDir === "asc" ? "asc" : "desc";
          const nextDir = currentDir === "asc" ? "desc" : "asc";

          table.querySelectorAll("thead th").forEach(th => {
            th.dataset.sortDir = "desc";
            const icon = th.querySelector(".sort-icon");
            if (icon) icon.textContent = "↕";
          });

          sortTable(table, index, nextDir);
          header.dataset.sortDir = nextDir;

          const icon = header.querySelector(".sort-icon");
          if (icon) icon.textContent = nextDir === "asc" ? "↑" : "↓";
        });
      });
    }

    function sortTable(table, colIndex, direction) {
      const tbody = table.querySelector("tbody");
      const rows = [...tbody.querySelectorAll("tr")];

      rows.sort((a, b) => {
        const aText = a.children[colIndex]?.textContent.trim() || "";
        const bText = b.children[colIndex]?.textContent.trim() || "";

        const aNum = parseSortableValue(aText);
        const bNum = parseSortableValue(bText);

        if (!Number.isNaN(aNum) && !Number.isNaN(bNum)) {
          return direction === "asc" ? aNum - bNum : bNum - aNum;
        }

        return direction === "asc"
          ? aText.localeCompare(bText, undefined, { numeric: true, sensitivity: "base" })
          : bText.localeCompare(aText, undefined, { numeric: true, sensitivity: "base" });
      });

      rows.forEach(row => tbody.appendChild(row));
    }

    function parseSortableValue(value) {
      const cleaned = String(value).replace(/[^0-9.\-]/g, "");
      if (cleaned === "" || cleaned === "-" || cleaned === "." || cleaned === "-.") return NaN;
      return parseFloat(cleaned);
    }

    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function showTab(tabId) {
      ["sector", "country"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
        document.getElementById("tab-" + id).classList.remove("active");
      });

      document.getElementById(tabId).classList.remove("hidden");
      document.getElementById("tab-" + tabId).classList.add("active");
    }

    init();
  </script>
</body>
</html>
